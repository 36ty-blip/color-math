[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-color-math"
version = "0.1.1"
description = "Automatically apply semantic colors to LaTeX and MathJax equations in Obsidian Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya" }]
keywords = ["obsidian", "latex", "mathjax", "math", "equations", "markdown", "colorizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Repository = "https://github.com/36ty-blip/obsidian-color-math"
Issues = "https://github.com/36ty-blip/obsidian-color-math/issues"
"Release Notes" = "https://github.com/36ty-blip/obsidian-color-math/releases"

[project.scripts]
color-math = "color_math.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["color_math*"]
